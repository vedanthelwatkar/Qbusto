<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      Served straight out of public/, which Vite copies to the root of the build,
      so these paths hold in dev and in production alike.

      .ico first with sizes="any" - browsers that understand the PNG hints below
      take those, and the rest fall back to the multi-resolution .ico.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Brand primary. Must match PALETTE.primary[500] in src/theme.ts. -->
    <meta name="theme-color" content="#FF8C23" />
    <title>QBusto Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
