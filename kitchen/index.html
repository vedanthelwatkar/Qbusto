<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      Served straight out of public/, which Vite copies to the root of the
      build, so these paths hold in dev and in production alike.

      .ico first with sizes="any" - browsers that understand the PNG hints
      below take those, and the rest fall back to the multi-resolution .ico.

      The kitchen's copies are the WHITE variant of the mark: this app is a
      dark board on a wall-mounted screen, and the orange original disappears
      against the browser chrome a display like that runs in.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070a" />
    <title>QBusto Kitchen Display</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
